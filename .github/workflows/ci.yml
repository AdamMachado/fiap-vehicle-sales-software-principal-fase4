name: CI-CD
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --collect "XPlat Code Coverage" --settings coverage.runsettings --results-directory TestResults
      - name: Enforce coverage
        shell: pwsh
        run: ./scripts/check-coverage.ps1 -ResultsPath TestResults -Minimum 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-and-coverage
          path: TestResults/**

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -f src/Fiap.VehicleSales.Main.Api/Dockerfile -t ghcr.io/adammachado/fiap-vehicle-sales-main-api:${{ github.sha }} -t ghcr.io/adammachado/fiap-vehicle-sales-main-api:latest .
      - run: docker push --all-tags ghcr.io/adammachado/fiap-vehicle-sales-main-api
